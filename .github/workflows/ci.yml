name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libespeak-ng-dev cmake build-essential curl tar

      - name: Baseline tests
        run: cargo test

      - name: Feature matrix tests
        run: cargo test --features "c-oracle,bundled-espeak"

      - name: Oracle parity tests (verbose)
        run: cargo test --features "c-oracle,bundled-espeak" --test oracle_comparison -- --nocapture

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Denied lints fail the job; `[lints.clippy]` warnings are the backlog.
      - name: Clippy
        run: cargo clippy --locked --lib --bins

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [dictionary, phontab, text_to_ipa]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz for two minutes
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -max_total_time=120 -timeout=30 -len_control=0
